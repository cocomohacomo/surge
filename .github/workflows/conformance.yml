name: SURGE v0.9 conformance

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: surge-conformance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpp-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Install relocatable CMake package
        run: cmake --install build --config Release --prefix "$PWD/stage"
      - name: Build external installed-package consumer
        run: |
          cmake -S tests/cmake_consumer -B build-consumer -DCMAKE_PREFIX_PATH="$PWD/stage" -DCMAKE_BUILD_TYPE=Release
          cmake --build "${{ github.workspace }}/build-consumer" --config Release --parallel
          ./build-consumer/surge_installed_consumer

  journal-cross-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.6.0
        with:
          python-version: "3.12"
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSURGE_BUILD_BENCHMARKS=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Inspect built shared-library C ABI exports
        run: python tools/check_binary_abi.py --library build
      - name: Inspect public C ABI struct layouts
        run: ctest --test-dir build -C Release --output-on-failure -V -R surge_c_abi_layout_conformance
      - name: C++ journal lock and durability tests
        run: ctest --test-dir build -C Release --output-on-failure -R surge_event_journal_conformance
      - name: Portable journal benchmark and identity guardrails
        run: ctest --test-dir build -C Release --output-on-failure -R surge_journal_benchmark
      - name: Snapshot store atomic replacement and recovery tests
        run: ctest --test-dir build -C Release --output-on-failure -R surge_snapshot_store_conformance
      - name: Journal identity memory budget tests
        run: ctest --test-dir build -C Release --output-on-failure -R surge_journal_identity_budget_conformance
      - name: Copy-on-write journal compaction and recovery tests
        run: ctest --test-dir build -C Release --output-on-failure -R surge_journal_compaction_conformance
      - name: Verified journal backup retention tests
        run: ctest --test-dir build -C Release --output-on-failure -R surge_journal_backup_retention_conformance
      - name: Python journal backup and lock parity tests
        run: python -m unittest discover -s tests -p test_journal_backup.py -v
      - name: Install and consume native CMake package
        run: |
          cmake --install build --config Release --prefix "${{ runner.temp }}/surge-stage"
          python tools/check_cmake_install_tree.py "${{ runner.temp }}/surge-stage" "${{ github.workspace }}" "${{ github.workspace }}/build"
          cmake -S "${{ github.workspace }}/tests/cmake_consumer" -B "${{ github.workspace }}/build-consumer" -DCMAKE_PREFIX_PATH="${{ runner.temp }}/surge-stage" -DCMAKE_BUILD_TYPE=Release
          cmake --build "${{ github.workspace }}/build-consumer" --config Release --parallel
          ctest --test-dir "${{ github.workspace }}/build-consumer" -C Release --output-on-failure
      - name: Verify clean-prefix backup restore with installed native process
        run: python tools/test_installed_backup_restore.py

  schema-and-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - name: Build shared C++ Core for Python integration
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel
      - name: Validate schemas and fixtures
        run: python tools/validate_fixtures.py
      - name: Verify reviewed public C ABI declaration surface
        run: python tools/check_c_abi.py
      - name: Verify versioned C ABI compatibility against immutable baselines
        run: python tools/check_abi_compatibility.py
      - name: Install native Core into an isolated prefix
        run: cmake --install build --config Release --prefix "$GITHUB_WORKSPACE/native-stage"
      - name: Python adapter regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build and install standalone Python wheel
        run: |
          python -m pip install build
          python -m build --wheel
          python tools/generate_sbom.py --wheel dist/*.whl --output dist/surge-sbom.cdx.json
          python -m venv wheel-test-env
          wheel-test-env/bin/python -m pip install dist/*.whl
          cd /tmp
          "$GITHUB_WORKSPACE/wheel-test-env/bin/python" -c "from surge_adapter.packet_ingest import RecognitionPacketAdapter; RecognitionPacketAdapter(); print('installed wheel schema lookup passed')"
          env -u PYTHONPATH SURGE_CORE_PREFIX="$GITHUB_WORKSPACE/native-stage" "$GITHUB_WORKSPACE/wheel-test-env/bin/python" - <<'PY'
          import tempfile
          from pathlib import Path
          from surge_adapter.packet_ingest import CppCoreBridge
          with tempfile.TemporaryDirectory() as tmp:
              with CppCoreBridge(Path(tmp) / "clean-install.sgj") as core:
                  assert core.state_version == 0
          print("isolated wheel + installed native Core discovery passed")
          PY
      - name: Retain CycloneDX SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: surge-sbom
          path: dist/surge-sbom.cdx.json
          if-no-files-found: error

  asan-ubsan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang
      - name: Configure sanitizer build
        run: >-
          cmake -S . -B build-asan
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_BUILD_TYPE=Debug
          -DSURGE_ENABLE_SANITIZERS=ON
      - name: Build
        run: cmake --build build-asan --parallel 2
      - name: Run C++ conformance under ASan and UBSan
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build-asan --output-on-failure

  libfuzzer-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang
      - name: Configure fuzz target
        run: >-
          cmake -S . -B build-fuzz
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DSURGE_BUILD_FUZZERS=ON
      - name: Build EventJournal fuzz target
        run: cmake --build build-fuzz --target surge_journal_fuzz --parallel 2
      - name: Run bounded fuzz smoke test
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ./build-fuzz/surge_journal_fuzz -max_total_time=20 -max_len=65536

  edge-resource-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Configure measured EventJournal profile
        run: cmake -S . -B build-edge -DCMAKE_BUILD_TYPE=Release -DSURGE_BUILD_BENCHMARKS=ON
      - name: Build profile harness
        run: cmake --build build-edge --target surge_journal_bench --config Release --parallel 2
      - name: Measure 10000-event bounded profile
        run: ./build-edge/surge_journal_bench 10000 128 10000 8388608 > "$RUNNER_TEMP/surge-edge-profile.json"
      - name: Validate profile and publish measurements
        run: python tools/validate_edge_benchmark.py --report "$RUNNER_TEMP/surge-edge-profile.json" --transactions 10000 --summary "$GITHUB_STEP_SUMMARY"
      - name: Build ContextGraph streaming benchmark
        run: cmake --build build-edge --target surge_context_graph_stream_bench --config Release --parallel 2
      - name: Measure bounded ContextGraph stream and publish RSS/latency split
        run: |
          ./build-edge/surge_context_graph_stream_bench 1000 10 > "$RUNNER_TEMP/surge-context-stream.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(Path(os.environ["RUNNER_TEMP"] + "/surge-context-stream.json").read_text())
          assert report["events_committed"] == 1000, report
          assert report["logical_vs_rss_are_distinct_metrics"] is True
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("### ContextGraph streaming profile (1,000 events)\n\n")
              summary.write("| Metric | Value |\n|---|---:|\n")
              for key in ("peak_rss_bytes", "rss_growth_bytes_per_1000_events",
                          "logical_resident_peak_accounted_bytes", "logical_resident_limit_bytes",
                          "recall_samples", "candidate_total", "candidate_max_per_recall",
                          "operation_p50_us", "operation_p95_us", "operation_p99_us",
                          "recall_p50_us", "recall_p95_us", "recall_p99_us"):
                  summary.write(f"| {key} | {report[key]} |\n")
          PY

  projection-simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install Python validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Build native Core for end-to-end projection simulation
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel 2
      - name: Run 96-item multi-projector stream simulation
        env:
          SURGE_SIMULATION_REPORT: ${{ runner.temp }}/surge-projection-simulation.json
        run: python -m unittest discover -s tests -p test_projection_simulation.py -v
      - name: Retain machine-readable simulation report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: surge-projection-simulation
          path: ${{ runner.temp }}/surge-projection-simulation.json
          if-no-files-found: error

  projection-long-document:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install Python validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Build native Core for long-document simulation
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel 2
      - name: Run multi-megabyte single-batch and chunked-stream simulation
        env:
          SURGE_LONG_DOCUMENT_REPORT: ${{ runner.temp }}/surge-projection-long-document.json
        run: python -m unittest discover -s tests -p test_projection_long_document.py -v
      - name: Retain machine-readable long-document report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: surge-projection-long-document
          path: ${{ runner.temp }}/surge-projection-long-document.json
          if-no-files-found: error

  journal-benchmark-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Configure benchmark
        run: cmake -S . -B build-bench -DCMAKE_BUILD_TYPE=Release -DSURGE_BUILD_BENCHMARKS=ON
      - name: Build benchmark
        run: cmake --build build-bench --target surge_journal_bench --config Release --parallel 2
      - name: Run benchmark smoke test
        run: ctest --test-dir build-bench -C Release --output-on-failure -R surge_journal_benchmark

  projection-continuity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install Python validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Build native Core for continuity simulation
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel 2
      - name: Run cross-block continuity and topic-branching simulation
        env:
          SURGE_CONTINUITY_REPORT: ${{ runner.temp }}/surge-projection-continuity.json
        run: python -m unittest discover -s tests -p test_projection_continuity.py -v
      - name: Retain continuity simulation report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: surge-projection-continuity
          path: ${{ runner.temp }}/surge-projection-continuity.json
          if-no-files-found: error

  cpu-projector-model-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.6.0
        with:
          python-version: "3.12"
      - name: Test semantic evaluator independently from model JSON output
        run: python -m unittest discover -s tests -p "test_projector_semantic_evaluation.py" -v
      - name: Install CPU inference build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git libopenblas-dev
          python -m pip install "huggingface_hub>=0.30,<2"
      - name: Build llama.cpp CPU CLI
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git "$RUNNER_TEMP/llama.cpp"
          cmake -S "$RUNNER_TEMP/llama.cpp" -B "$RUNNER_TEMP/llama.cpp/build" \
            -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=ON -DGGML_OPENMP=ON
          cmake --build "$RUNNER_TEMP/llama.cpp/build" --target llama-cli --parallel 2
      - name: Run Japanese projector model comparison on CPU
        env:
          LLAMA_CLI: ${{ runner.temp }}/llama.cpp/build/bin/llama-cli
          SURGE_MODEL_BENCH_DIR: ${{ runner.temp }}/surge-models
          SURGE_MODEL_BENCH_REPORT: ${{ runner.temp }}/surge-cpu-projector-benchmark.json
          SURGE_MODEL_THREADS: "2"
        run: python tools/benchmark_cpu_projectors.py
      - name: Evaluate semantic candidate and relation coverage
        env:
          INPUT_REPORT: ${{ runner.temp }}/surge-cpu-projector-benchmark.json
          OUTPUT_REPORT: ${{ runner.temp }}/surge-cpu-projector-semantic-evaluation.json
        run: |
          python tools/evaluate_projector_semantics.py "$INPUT_REPORT" "$OUTPUT_REPORT" | tee "$RUNNER_TEMP/surge-projector-semantic-evaluation.txt"
          cat "$RUNNER_TEMP/surge-projector-semantic-evaluation.txt" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish CPU model benchmark summary
        env:
          REPORT: ${{ runner.temp }}/surge-cpu-projector-benchmark.json
          SUMMARY: ${{ runner.temp }}/surge-cpu-projector-summary.md
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(Path(os.environ["REPORT"]).read_text(encoding="utf-8"))
          with open(os.environ["SUMMARY"], "a", encoding="utf-8") as out:
              out.write("## Japanese CPU projector model smoke benchmark\\n\\n")
              out.write("| Model | GGUF bytes | Valid JSON cases | Marker hits | Mean seconds |\\n|---|---:|---:|---:|---:|\\n")
              for model in report["models"]:
                  out.write(f"| {model['name']} | {model['file_bytes']} | {model['json_valid_cases']}/5 | {model['expected_marker_hits']}/{model['expected_marker_total']} | {model['mean_elapsed_seconds']} |\\n")
              out.write("\\nThis is a five-case synthetic smoke test, not a semantic-quality certification or target-device benchmark.\\n")
          PY
          cat "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain raw model outputs and measurements
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: surge-cpu-projector-model-benchmark
          path: ${{ runner.temp }}/surge-cpu-projector-benchmark.json
          if-no-files-found: error
